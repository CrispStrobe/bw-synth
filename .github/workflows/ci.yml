name: ci
on:
  push:
  pull_request:

jobs:
  request-path:
    # Everything that happens to a request BEFORE the toolchain: the contract,
    # the licence refusal, malformed bodies, and which failures are HTTP errors
    # rather than answers. None of it needs the ~300 MB install, and a suite that
    # did would have left this path untested — which it was, until now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: The request path and the licence screen
        run: python3 tests/run.py

  toolchain:
    # Proves the flow actually runs, on a real blinky, against the real tools.
    # Separate job because it installs ~300 MB and the screen must not wait on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: A blinky goes all the way to a bitstream
        run: python3 tests/smoke_blinky.py
