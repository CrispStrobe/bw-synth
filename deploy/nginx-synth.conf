# bw-synth reverse proxy. Copy to /etc/nginx/sites-available/synth, symlink into
# sites-enabled, then `certbot --nginx -d synth.<domain>` adds TLS + the :80->:443
# redirect (leaving this :80 block for the ACME challenge). The container listens
# only on 127.0.0.1:8091.
server {
    listen 80;
    server_name synth.example.com;   # <-- your host

    # Match api/synth.py MAX_BYTES so oversized uploads die at nginx, not gunicorn.
    client_max_body_size 2m;

    # The brickwright-lite editor is a static site on another origin, so the
    # browser needs CORS to POST here. Only the API is exposed; the rest 404s.
    location /api/ {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type" always;
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;   # place-and-route can be slow; match gunicorn
        proxy_send_timeout 300;
    }
    location / { return 404; }
}
